<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>药丸不是糖豆豆</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #3D2E1E;
    }

    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
    }

    .emoji-main {
      font-size: 160px;
      margin-bottom: 30px;
    }

    .title {
      font-size: 88px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 44px;
      text-align: center;
      opacity: 0.85;
    }

    .content {
      font-size: 56px;
      text-align: center;
      line-height: 1.8;
      max-width: 1400px;
      padding: 0 80px;
    }

    .scene-s1 {
      background: linear-gradient(135deg, #FFF8E7 0%, #FFE4B5 100%);
    }

    .scene-s2 {
      background: linear-gradient(135deg, #FFF0F0 0%, #FFD6D6 100%);
    }

    .scene-s3 {
      background: linear-gradient(135deg, #E8FFF8 0%, #B5F5E8 100%);
    }

    .scene-s4 {
      background: linear-gradient(135deg, #E8F4FF 0%, #B5DAFF 100%);
    }

    .scene-s5 {
      background: linear-gradient(135deg, #FFF8E7 0%, #FFEAA7 100%);
    }

    .scene-s6 {
      background: linear-gradient(135deg, #F0E8FF 0%, #D6BFFF 100%);
    }

    .highlight {
      color: #FF6B6B;
      font-weight: bold;
    }

    .highlight-teal {
      color: #4ECDC4;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="51" data-width="1920" data-height="1080">

    <div id="scene1" class="scene scene-s1 clip" data-start="0.1" data-duration="4.7" data-track-index="1">
      <div class="emoji-main">💊</div>
      <div class="title">药丸不是糖豆豆</div>
      <div class="subtitle">小班安全教育</div>
    </div>

    <div id="scene2" class="scene scene-s2 clip" data-start="4.2" data-duration="11.3" data-track-index="2">
      <div class="emoji-main">🍬</div>
      <div class="content">小药丸穿着<span class="highlight">漂亮的彩色衣服</span><br>红的、黄的、绿的<br>看着像糖果，但里面是<span class="highlight">苦苦的药粉</span>哦！</div>
    </div>

    <div id="scene3" class="scene scene-s3 clip" data-start="14.9" data-duration="10.0" data-track-index="3">
      <div class="emoji-main">🏥</div>
      <div class="content">乐乐把药当糖吃了<br>结果<span class="highlight">肚子好疼好疼</span><br>被送去了医院<br>王医生说：乱吃药会更严重！</div>
    </div>

    <div id="scene4" class="scene scene-s4 clip" data-start="24.3" data-duration="9.3" data-track-index="4">
      <div class="emoji-main">👨‍⚕️</div>
      <div class="content">生病了要让<span class="highlight-teal">医生叔叔阿姨</span>告诉我们吃什么药<br><span class="highlight-teal">爸爸妈妈喂给我们</span>才可以吃哦！</div>
    </div>

    <div id="scene5" class="scene scene-s5 clip" data-start="33.0" data-duration="9.6" data-track-index="5">
      <div class="emoji-main">🚫</div>
      <div class="content">家里的小药箱是<span class="highlight">大人用的</span><br>小朋友不能自己打开玩<br>想吃糖找妈妈要糖果就好啦！</div>
    </div>

    <div id="scene6" class="scene scene-s6 clip" data-start="42.1" data-duration="8.8" data-track-index="6">
      <div class="emoji-main">👏</div>
      <div class="content">🎵 生病了，该吃药<br>乱吃药，不得了<br>吃药药，大事情<br>等着爸妈来喂我！🎵</div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    // 场景1（标题）: data-start=0
    tl.from('#scene1 .emoji-main', { opacity: 0, scale: 0.5, y: -60, duration: 0.6, ease: "back.out(1.7)" }, 0.4);
    tl.from('#scene1 .title',      { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" },             0.9);
    tl.from('#scene1 .subtitle',   { opacity: 0, y: 30, duration: 0.5, ease: "power2.out" },             1.4);

    // 场景2（药丸像糖果）: data-start=7
    tl.from('#scene2 .emoji-main', { opacity: 0, scale: 0, rotation: -20, duration: 0.5, ease: "back.out(1.7)" }, 4.5);
    tl.from('#scene2 .content',    { opacity: 0, x: -40, duration: 0.5, ease: "power3.out" },                      5.0);

    // 场景3（乐乐的故事）: data-start=15
    tl.from('#scene3 .emoji-main', { opacity: 0, scale: 0, rotation: 15, duration: 0.5, ease: "back.out(1.7)" }, 15.2);
    tl.from('#scene3 .content',    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" },                      15.7);

    // 场景4（医生指导）: data-start=23
    tl.from('#scene4 .emoji-main', { opacity: 0, scale: 0.5, y: -40, duration: 0.5, ease: "back.out(1.7)" }, 24.6);
    tl.from('#scene4 .content',    { opacity: 0, x: 40, duration: 0.5, ease: "power3.out" },                  25.1);

    // 场景5（药箱安全）: data-start=31
    tl.from('#scene5 .emoji-main', { opacity: 0, scale: 0, rotation: -10, duration: 0.5, ease: "back.out(1.7)" }, 33.3);
    tl.from('#scene5 .content',    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" },                      33.8);

    // 场景6（儿歌）: data-start=38
    tl.from('#scene6 .emoji-main', { opacity: 0, scale: 0.5, rotation: 20, duration: 0.5, ease: "back.out(1.7)" }, 42.4);
    tl.from('#scene6 .content',    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" },                       42.9);

    // 最后场景淡出
    tl.to('#scene6', { opacity: 0, duration: 1.5, ease: "power2.inOut" }, 47.6);
  </script>

  <audio id="narration" data-start="0" data-duration="51" data-track-index="0" src="narration.wav" data-volume="1"></audio>
</body>
</html>
