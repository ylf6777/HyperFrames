<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FFF8E7; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }

      .scene {
        position: absolute; inset: 0;
        width: 1920px; height: 1080px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        padding: 80px 120px;
      }
      .scene-content {
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        gap: 30px;
        text-align: center;
      }

      .title-big {
        font-size: 100px; font-weight: 900;
        color: #3D2E1E; line-height: 1.3;
      }
      .title-medium {
        font-size: 72px; font-weight: 700;
        color: #3D2E1E; line-height: 1.4;
      }
      .text-body {
        font-size: 48px; font-weight: 500;
        color: #5A4A3A; line-height: 1.6;
        max-width: 1400px;
      }
      .text-highlight {
        font-size: 56px; font-weight: 700;
        color: #FF6B6B; line-height: 1.5;
      }
      .emoji-icon {
        font-size: 120px; margin-bottom: 20px;
      }
      .slogan {
        font-size: 72px; font-weight: 900;
        background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .warning-sign {
        display: inline-block;
        width: 60px; height: 60px;
        background: #FF6B6B; color: #FFF;
        border-radius: 50%;
        font-size: 36px; font-weight: 900;
        line-height: 60px; text-align: center;
        margin-right: 10px;
      }

      .scene-s1 { background: linear-gradient(135deg, #FFF8E7, #FFE8D6); }
      .scene-s2 { background: linear-gradient(135deg, #E8F8F5, #FFF8E7); }
      .scene-s3 { background: linear-gradient(135deg, #FFF0F0, #FFE8D6); }
      .scene-s4 { background: linear-gradient(135deg, #E8F4FD, #FFF8E7); }
      .scene-s5 { background: linear-gradient(135deg, #F3E8FF, #FFF8E7); }
      .scene-s6 { background: linear-gradient(135deg, #FFF8E7, #E8F8F5); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="38"
      data-width="1920"
      data-height="1080"
    >

      <!-- ============================================= -->
      <!-- 场景 1：标题开场（0s - 6s）                     -->
      <!-- ============================================= -->
      <div id="scene1" class="scene scene-s1 clip" data-start="0" data-duration="7.5" data-track-index="1">
        <div class="scene-content">
          <div class="emoji-icon">🧸🎠🎪</div>
          <div class="title-big">不抢玩具</div>
          <div class="title-medium" style="color: #FF6B6B;">快乐分享小课堂</div>
          <div class="text-body" style="font-size: 32px; color: #999;">
            适合 3-5 岁小朋友
          </div>
        </div>
      </div>

      <!-- ============================================= -->
      <!-- 场景 2：玩具一起玩（6s - 13s）                   -->
      <!-- ============================================= -->
      <div id="scene2" class="scene scene-s2 clip" data-start="7.5" data-duration="5" data-track-index="2">
        <div class="scene-content">
          <div class="emoji-icon">🎮🧩🎲</div>
          <div class="text-body">
            玩具要<strong style="color:#4ECDC4;">大家一起玩</strong>，才开心！
          </div>
          <div style="display:flex; align-items:center; gap:20px; margin-top:10px;">
            <span style="font-size:80px;">🙅</span>
            <div class="text-highlight">不能独占玩具</div>
          </div>
          <div class="text-body" style="font-size:36px; color:#FF6B6B;">
            ✋ 也不能争夺玩具哦
          </div>
        </div>
      </div>

      <!-- ============================================= -->
      <!-- 场景 3：轮流玩（13s - 20s）                      -->
      <!-- ============================================= -->
      <div id="scene3" class="scene scene-s3 clip" data-start="12.5" data-duration="7.5" data-track-index="3">
        <div class="scene-content">
          <div class="emoji-icon">🔄🤗</div>
          <div class="text-body">
            一个玩具大家都想玩，我们可以<strong style="color:#4ECDC4;">轮流玩</strong>
          </div>
          <div style="display:flex; align-items:center; gap:30px; margin-top:10px; flex-wrap:wrap; justify-content:center;">
            <div style="font-size:48px; background:#FFE8D6; padding:15px 30px; border-radius:15px;">
              🙋 你先玩
            </div>
            <div style="font-size:48px; background:#E8F8F5; padding:15px 30px; border-radius:15px;">
              🙋 他再玩
            </div>
            <div style="font-size:48px; background:#F3E8FF; padding:15px 30px; border-radius:15px;">
              🙋 我后玩
            </div>
          </div>
        </div>
      </div>

      <!-- ============================================= -->
      <!-- 场景 4：交换玩（20s - 27s）                      -->
      <!-- ============================================= -->
      <div id="scene4" class="scene scene-s4 clip" data-start="20" data-duration="6.5" data-track-index="4">
        <div class="scene-content">
          <div class="emoji-icon">🤝🎁</div>
          <div class="text-body">
            也可以<strong style="color:#4ECDC4;">交换玩</strong>
          </div>
          <div style="display:flex; align-items:center; gap:20px; margin-top:10px; flex-wrap:wrap; justify-content:center;">
            <span style="font-size:80px;">🧸</span>
            <span style="font-size:48px; color:#5A4A3A;">你玩我的，我玩你的</span>
            <span style="font-size:80px;">🚗</span>
          </div>
          <div class="text-body" style="font-size:36px; color:#4ECDC4;">
            这样大家都能玩到不同的玩具！
          </div>
        </div>
      </div>

      <!-- ============================================= -->
      <!-- 场景 5：不能争抢（27s - 34s）                     -->
      <!-- ============================================= -->
      <div id="scene5" class="scene scene-s5 clip" data-start="26.5" data-duration="7.5" data-track-index="5">
        <div class="scene-content">
          <div class="emoji-icon">⚠️😟</div>
          <div class="text-body">
            不能<strong style="color:#FF6B6B;">争抢</strong>玩具
          </div>
          <div style="display:flex; align-items:center; gap:20px; margin-top:10px;">
            <span style="font-size:80px;">👎</span>
            <div>
              <div class="text-highlight" style="font-size:48px;">抢玩具是不对的</div>
              <div class="text-body" style="font-size:36px; color:#FF6B6B;">那样大家都玩不开心</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============================================= -->
      <!-- 场景 6：总结（34s - 43s）                         -->
      <!-- ============================================= -->
      <div id="scene6" class="scene scene-s6 clip" data-start="34" data-duration="4" data-track-index="6">
        <div class="scene-content">
          <div class="emoji-icon">🎉🥳</div>
          <div class="slogan">学会谦让，一起玩才开心！</div>
          <div class="text-body" style="font-size:36px; margin-top:20px;">
            分享玩具，快乐加倍 🧸✨
          </div>
        </div>
      </div>

      <audio
        id="narration"
        data-start="0"
        data-duration="38"
        data-track-index="0"
        src="narration.wav"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ========== 场景 1：标题开场 ==========
      tl.from("#scene1 .emoji-icon", { scale: 0, opacity: 0, duration: 0.6, ease: "back.out(1.7)" }, 0.2);
      tl.from("#scene1 .title-big", { y: 60, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.6);
      tl.from("#scene1 .title-medium", { y: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.9);
      tl.from("#scene1 .text-body", { y: 20, opacity: 0, duration: 0.4, ease: "power1.out" }, 1.2);

      // ========== 场景 2：玩具一起玩 ==========
      tl.from("#scene2 .emoji-icon", { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.5)" }, 7.7);
      tl.from("#scene2 .scene-content > .text-body:nth-child(2)", { x: -40, opacity: 0, duration: 0.5, ease: "power3.out" }, 8.0);
      tl.from("#scene2 .scene-content > div:nth-child(3)", { x: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 8.5);
      tl.from("#scene2 .scene-content > div:nth-child(4)", { y: 20, opacity: 0, duration: 0.4, ease: "power1.out" }, 9.0);

      // ========== 场景 3：轮流玩 ==========
      tl.from("#scene3 .emoji-icon", { rotation: -30, opacity: 0, duration: 0.5, ease: "power3.out" }, 12.7);
      tl.from("#scene3 .scene-content > .text-body:nth-child(2)", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 13.0);
      tl.from("#scene3 .scene-content > div:nth-child(3) > div:nth-child(1)", { scale: 0.8, opacity: 0, duration: 0.4, ease: "back.out(1.4)" }, 13.5);
      tl.from("#scene3 .scene-content > div:nth-child(3) > div:nth-child(2)", { scale: 0.8, opacity: 0, duration: 0.4, ease: "back.out(1.4)" }, 13.8);
      tl.from("#scene3 .scene-content > div:nth-child(3) > div:nth-child(3)", { scale: 0.8, opacity: 0, duration: 0.4, ease: "back.out(1.4)" }, 14.1);

      // ========== 场景 4：交换玩 ==========
      tl.from("#scene4 .emoji-icon", { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.5)" }, 20.2);
      tl.from("#scene4 .scene-content > .text-body:nth-child(2)", { x: -50, opacity: 0, duration: 0.5, ease: "power3.out" }, 20.5);
      tl.from("#scene4 .scene-content > div:nth-child(3)", { x: 50, opacity: 0, duration: 0.5, ease: "power2.out" }, 21.0);
      tl.from("#scene4 .scene-content > div:nth-child(4)", { y: 20, opacity: 0, duration: 0.4, ease: "power1.out" }, 21.5);

      // ========== 场景 5：不能争抢 ==========
      tl.from("#scene5 .emoji-icon", { rotation: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, 26.7);
      tl.from("#scene5 .scene-content > .text-body:nth-child(2)", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 27.0);
      tl.from("#scene5 .scene-content > div:nth-child(3)", { x: 40, opacity: 0, duration: 0.5, ease: "power2.out" }, 27.5);

      // ========== 场景 6：总结 ==========
      tl.from("#scene6 .emoji-icon", { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.5)" }, 34.2);
      tl.from("#scene6 .slogan", { y: 50, opacity: 0, duration: 0.6, ease: "power3.out" }, 34.5);
      tl.from("#scene6 .text-body", { y: 30, opacity: 0, duration: 0.5, ease: "power2.out" }, 35.0);

      // ========== 最后淡出 ==========
      tl.to("#scene6 .scene-content", { opacity: 0, duration: 1.0, ease: "power2.in" }, 36.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
