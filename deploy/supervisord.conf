; 文生视频 — Supervisor 进程管理配置（Linux）
; 安装: apt install supervisor (Debian/Ubuntu)
; 放置: /etc/supervisor/conf.d/text2video.conf
; 重载: supervisorctl reload

[program:text2video-server]
command=/path/to/venv/bin/uvicorn server:app --host 127.0.0.1 --port 8000
directory=/path/to/text2video
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/var/log/text2video/server.log
stderr_logfile=/var/log/text2video/server.err
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
environment=
    FEISHU_APP_ID="%(ENV_FEISHU_APP_ID)s",
    FEISHU_APP_SECRET="%(ENV_FEISHU_APP_SECRET)s",
    FEISHU_BASE_TOKEN="%(ENV_FEISHU_BASE_TOKEN)s",
    FEISHU_TABLE_ID="%(ENV_FEISHU_TABLE_ID)s",
    HYPERFRAMES_API_KEY="%(ENV_HYPERFRAMES_API_KEY)s",
    HYPERFRAMES_BASE_URL="%(ENV_HYPERFRAMES_BASE_URL)s",
    SMTP_HOST="%(ENV_SMTP_HOST)s",
    SMTP_USER="%(ENV_SMTP_USER)s",
    SMTP_PASS="%(ENV_SMTP_PASS)s",
    PUBLIC_URL="https://your-domain.com",
    ALLOW_ORIGINS="https://your-domain.com"

[program:text2video-worker]
command=/path/to/venv/bin/python worker.py
directory=/path/to/text2video
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/text2video/worker.log
stderr_logfile=/var/log/text2video/worker.err
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
environment=
    FEISHU_APP_ID="%(ENV_FEISHU_APP_ID)s",
    FEISHU_APP_SECRET="%(ENV_FEISHU_APP_SECRET)s",
    FEISHU_BASE_TOKEN="%(ENV_FEISHU_BASE_TOKEN)s",
    FEISHU_TABLE_ID="%(ENV_FEISHU_TABLE_ID)s",
    HYPERFRAMES_API_KEY="%(ENV_HYPERFRAMES_API_KEY)s",
    HYPERFRAMES_BASE_URL="%(ENV_HYPERFRAMES_BASE_URL)s"
