# 文生视频 — Nginx 生产配置
# 用法: 将本文件复制到 nginx/conf/nginx.conf（或 include）
#       修改 server_name、ssl_certificate 等为实际值

upstream fastapi_backend {
    # FastAPI 后端（可加多个实例做负载均衡）
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;  # ← 改你的域名

    # ── HTTP → HTTPS 跳转 ──
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # ← 改你的域名

    # ── SSL（用 certbot 或 acme.sh 自动申请） ──
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── 前端静态文件 ──
    root /path/to/frontend/dist;  # ← 改实际路径
    index index.html;

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.svg {
        expires 7d;
    }

    location /icons.svg {
        expires 7d;
    }

    # ── API 反向代理 ──
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（视频生成可能耗时较长）
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # ── 视频下载（大文件优化） ──
    location /api/videos/ {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 大文件不分块缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── SPA 兜底 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 限制上传大小（与后端 MAX_FILE_SIZE_MB 一致） ──
    client_max_body_size 60M;

    # ── 日志 ──
    access_log /var/log/nginx/text2video-access.log;
    error_log  /var/log/nginx/text2video-error.log;
}
