<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>安全乘电梯 · 幼儿安全教育</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #FFF8E7;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #3D2E1E;
    }

    #root {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
    }

    /* ── 通用场景 ── */
    .scene {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 80px 160px;
      opacity: 1;
    }

    .emoji-main {
      font-size: 160px;
      line-height: 1;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.12));
    }

    .title {
      font-size: 88px;
      font-weight: 900;
      color: #3D2E1E;
      text-align: center;
      letter-spacing: 4px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.10);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 52px;
      font-weight: 700;
      color: #FF6B6B;
      text-align: center;
      letter-spacing: 2px;
    }

    .content {
      font-size: 54px;
      font-weight: 700;
      color: #3D2E1E;
      text-align: center;
      line-height: 1.7;
      max-width: 1500px;
    }

    .content em {
      color: #FF6B6B;
      font-style: normal;
    }

    .content strong {
      color: #4ECDC4;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      align-items: center;
    }

    .tag {
      background: rgba(255,255,255,0.70);
      border-radius: 60px;
      padding: 18px 48px;
      font-size: 48px;
      font-weight: 800;
      color: #3D2E1E;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 3px solid rgba(255,255,255,0.9);
    }

    .tag.red   { background: #FF6B6B; color: #fff; }
    .tag.teal  { background: #4ECDC4; color: #fff; }
    .tag.yellow{ background: #FFD93D; color: #3D2E1E; }
    .tag.coral { background: #FF8E53; color: #fff; }

    .rule-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: flex-start;
    }

    .rule-item {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255,255,255,0.75);
      border-radius: 28px;
      padding: 20px 48px;
      font-size: 50px;
      font-weight: 800;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    .rule-item .icon { font-size: 56px; }
    .rule-item.no   { color: #FF6B6B; border: 3px solid #FF6B6B; }
    .rule-item.yes  { color: #4ECDC4; border: 3px solid #4ECDC4; }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(255,255,255,0.80);
      border-radius: 28px;
      padding: 18px 52px;
      font-size: 48px;
      font-weight: 800;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      min-width: 900px;
    }

    .step-num {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #FF6B6B;
      color: #fff;
      font-size: 40px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── 场景背景 ── */
    .scene-s1 { background: linear-gradient(135deg, #FFF8E7 0%, #FFE0B2 100%); }
    .scene-s2 { background: linear-gradient(135deg, #E3F9F8 0%, #B2EBE9 100%); }
    .scene-s3 { background: linear-gradient(135deg, #FFF3CD 0%, #FFE082 100%); }
    .scene-s4 { background: linear-gradient(135deg, #FFEBEE 0%, #FFCDD2 100%); }
    .scene-s5 { background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%); }
    .scene-s6 { background: linear-gradient(135deg, #EDE7F6 0%, #D1C4E9 100%); }

    /* 装饰圆圈 */
    .deco-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.18;
      pointer-events: none;
    }
    .scene-s1 .deco-circle { background: #FF6B6B; }
    .scene-s2 .deco-circle { background: #4ECDC4; }
    .scene-s3 .deco-circle { background: #FFD93D; }
    .scene-s4 .deco-circle { background: #FF6B6B; }
    .scene-s5 .deco-circle { background: #66BB6A; }
    .scene-s6 .deco-circle { background: #7E57C2; }

    .deco-a { width: 420px; height: 420px; top: -120px; left: -120px; }
    .deco-b { width: 300px; height: 300px; bottom: -80px; right: -60px; }
    .deco-c { width: 200px; height: 200px; top: 60px; right: 200px; }
  </style>
</head>

<body>
<div id="root"
  data-composition-id="main"
  data-start="0"
  data-duration="51"
  data-width="1920"
  data-height="1080">

  <!-- ══ 场景 1：标题引入 ══ -->
  <div id="scene1" class="scene scene-s1 clip" data-start="0.1" data-duration="4.4" data-track-index="1">
    <div class="deco-circle deco-a"></div>
    <div class="deco-circle deco-b"></div>
    <div class="emoji-main">🏢</div>
    <div class="title">安全乘电梯</div>
    <div class="subtitle">爬楼梯好累，电梯嗖一下就上去啦！</div>
  </div>

  <!-- ══ 场景 2：电梯种类 ══ -->
  <div id="scene2" class="scene scene-s2 clip" data-start="3.9" data-duration="11.3" data-track-index="2">
    <div class="deco-circle deco-a"></div>
    <div class="deco-circle deco-c"></div>
    <div class="emoji-main">🛗</div>
    <div class="title">电梯有好多种！</div>
    <div class="tag-row">
      <div class="tag teal">🔄 自动扶梯</div>
      <div class="tag yellow">🔭 观光电梯</div>
      <div class="tag teal">📦 普通电梯</div>
      <div class="tag">🏗️ 升降梯（工地专用）</div>
    </div>
    <div class="content">你在哪里坐过电梯？快想一想！</div>
  </div>

  <!-- ══ 场景 3：认识标志 ══ -->
  <div id="scene3" class="scene scene-s3 clip" data-start="14.6" data-duration="9.2" data-track-index="3">
    <div class="deco-circle deco-a"></div>
    <div class="deco-circle deco-b"></div>
    <div class="emoji-main">🔍</div>
    <div class="title">电梯里的悄悄话</div>
    <div class="content">
      电梯里贴着好多小图案，<br/>
      每一个都在<em>提醒我们注意安全</em>！<br/>
      猜猜看，这个图案想告诉我们什么？
    </div>
  </div>

  <!-- ══ 场景 4：三个不可以 ══ -->
  <div id="scene4" class="scene scene-s4 clip" data-start="23.2" data-duration="8.8" data-track-index="4">
    <div class="deco-circle deco-a"></div>
    <div class="deco-circle deco-c"></div>
    <div class="emoji-main">🚫</div>
    <div class="title">三个<em style="color:#FF6B6B">不可以</em>！</div>
    <div class="rule-list">
      <div class="rule-item no"><span class="icon">🚪</span>不可以用身体挡住电梯门！</div>
      <div class="rule-item no"><span class="icon">🔘</span>不可以乱按按钮！</div>
      <div class="rule-item no"><span class="icon">🦘</span>不可以在里面蹦蹦跳跳！</div>
    </div>
  </div>

  <!-- ══ 场景 5：乘梯礼仪 ══ -->
  <div id="scene5" class="scene scene-s5 clip" data-start="31.4" data-duration="7.1" data-track-index="5">
    <div class="deco-circle deco-a"></div>
    <div class="deco-circle deco-b"></div>
    <div class="emoji-main">🤝</div>
    <div class="title">像小绅士、小淑女！</div>
    <div class="rule-list">
      <div class="rule-item yes"><span class="icon">🧍</span>安静站好，不推不挤</div>
      <div class="rule-item yes"><span class="icon">💛</span>把空间让给旁边的人</div>
    </div>
  </div>

  <!-- ══ 场景 6：急救自救 ══ -->
  <div id="scene6" class="scene scene-s6 clip" data-start="37.9" data-duration="13.2" data-track-index="6">
    <div class="deco-circle deco-a"></div>
    <div class="deco-circle deco-c"></div>
    <div class="emoji-main">🦸</div>
    <div class="title">电梯坏了不要慌！</div>
    <div class="step-list">
      <div class="step-item"><div class="step-num">1</div>深呼吸，不哭不慌！</div>
      <div class="step-item"><div class="step-num">2</div>🔴 按下红色报警按钮！</div>
      <div class="step-item"><div class="step-num">3</div>📞 拨打 119 求救！</div>
      <div class="step-item"><div class="step-num">4</div>👟 脱鞋拍门大声呼救！</div>
    </div>
  </div>

  <!-- ══ 音频 ══ -->
  <audio
    id="narration"
    data-start="0"
    data-duration="51"
    data-track-index="0"
    src="narration.wav"
    data-volume="1">
  </audio>

</div><!-- /#root -->

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["main"] = tl;

  /* ── 场景 1 · 开始于 0s ── */
  tl.from('#scene1 .emoji-main',
    { opacity: 0, scale: 0.4, y: -80, duration: 0.7, ease: "back.out(1.7)" }, 0.4);
  tl.from('#scene1 .title',
    { opacity: 0, y: 50, duration: 0.55, ease: "power3.out" }, 1.0);
  tl.from('#scene1 .subtitle',
    { opacity: 0, y: 36, duration: 0.5, ease: "power2.out" }, 1.5);

  /* ── 场景 2 · 开始于 9s ── */
  tl.from('#scene2 .emoji-main',
    { opacity: 0, scale: 0.3, rotation: -20, duration: 0.6, ease: "back.out(1.7)" }, 4.2);
  tl.from('#scene2 .title',
    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, 4.7);
  tl.from('#scene2 .tag-row .tag',
    { opacity: 0, y: 30, stagger: 0.18, duration: 0.45, ease: "power2.out" }, 5.2);
  tl.from('#scene2 .content',
    { opacity: 0, y: 28, duration: 0.45, ease: "power2.out" }, 6.1);

  /* ── 场景 3 · 开始于 18s ── */
  tl.from('#scene3 .emoji-main',
    { opacity: 0, scale: 0.4, y: -60, duration: 0.65, ease: "back.out(1.7)" }, 14.9);
  tl.from('#scene3 .title',
    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, 15.5);
  tl.from('#scene3 .content',
    { opacity: 0, x: -40, duration: 0.55, ease: "power3.out" }, 16.0);

  /* ── 场景 4 · 开始于 26s ── */
  tl.from('#scene4 .emoji-main',
    { opacity: 0, scale: 0.3, rotation: 20, duration: 0.6, ease: "back.out(1.7)" }, 23.5);
  tl.from('#scene4 .title',
    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, 24.1);
  tl.from('#scene4 .rule-list .rule-item',
    { opacity: 0, x: -50, stagger: 0.28, duration: 0.5, ease: "power3.out" }, 24.5);

  /* ── 场景 5 · 开始于 35s ── */
  tl.from('#scene5 .emoji-main',
    { opacity: 0, scale: 0.4, y: -60, duration: 0.65, ease: "back.out(1.7)" }, 31.7);
  tl.from('#scene5 .title',
    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, 32.3);
  tl.from('#scene5 .rule-list .rule-item',
    { opacity: 0, x: 50, stagger: 0.3, duration: 0.5, ease: "power3.out" }, 32.8);

  /* ── 场景 6 · 开始于 43s ── */
  tl.from('#scene6 .emoji-main',
    { opacity: 0, scale: 0.3, rotation: -15, duration: 0.65, ease: "back.out(1.7)" }, 38.2);
  tl.from('#scene6 .title',
    { opacity: 0, y: 40, duration: 0.5, ease: "power3.out" }, 38.8);
  tl.from('#scene6 .step-list .step-item',
    { opacity: 0, x: -44, stagger: 0.25, duration: 0.48, ease: "power3.out" }, 39.3);

  /* ── 最后场景淡出 ── */
  tl.to('#scene6',
    { opacity: 0, duration: 1.4, ease: "power2.inOut" }, 45.5);
</script>
</body>
</html>
