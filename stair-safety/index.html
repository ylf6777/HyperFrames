<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全上下楼梯 - 幼儿园安全教育</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #FFF8E7;
            overflow: hidden;
        }

        #root {
            width: 1920px;
            height: 1080px;
            position: relative;
            background: #FFF8E7;
            margin: 0 auto;
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 1;
        }

        .scene-s1 {
            background: linear-gradient(135deg, #FFF8E7 0%, #FFE5CC 100%);
        }

        .scene-s2 {
            background: linear-gradient(135deg, #FFE5CC 0%, #FFDAB9 100%);
        }

        .scene-s3 {
            background: linear-gradient(135deg, #FFDAB9 0%, #FFD4A3 100%);
        }

        .scene-s4 {
            background: linear-gradient(135deg, #FFD4A3 0%, #FFC8A2 100%);
        }

        .scene-s5 {
            background: linear-gradient(135deg, #FFC8A2 0%, #FFBFA0 100%);
        }

        .scene-s6 {
            background: linear-gradient(135deg, #FFBFA0 0%, #FFB89E 100%);
        }

        .scene-s7 {
            background: linear-gradient(135deg, #FFB89E 0%, #FFF8E7 100%);
        }

        .emoji-main {
            font-size: 120px;
            margin-bottom: 30px;
            display: inline-block;
        }

        .title {
            font-size: 72px;
            font-weight: bold;
            color: #3D2E1E;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 48px;
            color: #FF6B6B;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .content {
            font-size: 42px;
            color: #3D2E1E;
            line-height: 1.6;
            max-width: 1600px;
            padding: 0 60px;
            margin: 0 auto;
        }

        .content-small {
            font-size: 38px;
            color: #3D2E1E;
            line-height: 1.5;
            max-width: 1600px;
            padding: 0 60px;
            margin: 0 auto;
        }

        .highlight {
            color: #FF6B6B;
            font-weight: bold;
        }

        .highlight-green {
            color: #4ECDC4;
            font-weight: bold;
        }

        .verse {
            font-size: 40px;
            color: #3D2E1E;
            line-height: 1.8;
            max-width: 1600px;
            padding: 0 60px;
            margin: 0 auto;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="48" data-width="1920" data-height="1080">
        <!-- 场景1：标题场景 -->
        <div id="scene1" class="scene scene-s1 clip" data-start="0.0" data-duration="4.7" data-track-index="1">
            <div class="emoji-main">🪜</div>
            <div class="title">安全上下楼梯</div>
            <div class="subtitle">小朋友们，你们好！</div>
        </div>

        <!-- 场景2：引入场景 -->
        <div id="scene2" class="scene scene-s2 clip" data-start="4.7" data-duration="9.9" data-track-index="2">
            <div class="emoji-main">🐰</div>
            <div class="content">
                今天我们来学一个<span class="highlight">很重要的本领</span>。<br>
                你们有没有走过楼梯呀？
            </div>
        </div>

        <!-- 场景3：核心秘诀 -->
        <div id="scene3" class="scene scene-s3 clip" data-start="14.6" data-duration="12.3" data-track-index="3">
            <div class="emoji-main">✋</div>
            <div class="subtitle">走楼梯的秘诀</div>
            <div class="content-small">
                一手<span class="highlight">扶栏杆</span>，身体<span class="highlight">靠右走</span>。<br>
                眼睛<span class="highlight">看前方</span>，脚<span class="highlight">踩稳台阶</span>。<br>
                就像小兔子一样，稳稳地走！
            </div>
        </div>

        <!-- 场景4：排队规则 -->
        <div id="scene4" class="scene scene-s4 clip" data-start="26.9" data-duration="8.9" data-track-index="4">
            <div class="emoji-main">🐜</div>
            <div class="subtitle">人多时怎么办？</div>
            <div class="content-small">
                排好队，<span class="highlight">一个跟着一个</span>。<br>
                就像小蚂蚁搬家一样。<br>
                <span class="highlight-green">不拥挤、不推人</span>，保持安全距离！
            </div>
        </div>

        <!-- 场景5：儿歌 -->
        <div id="scene5" class="scene scene-s5 clip" data-start="35.8" data-duration="12.6" data-track-index="5">
            <div class="emoji-main">🎵</div>
            <div class="subtitle">安全楼梯歌</div>
            <div class="verse">
                一层楼，两层楼，<br>
                上下楼梯靠右走。<br>
                不急不挤不推搡，<br>
                安全走楼梯，大家都平安！
            </div>
        </div>

        <!-- 场景6：强化鼓励 -->
        <div id="scene6" class="scene scene-s6 clip" data-start="40" data-duration="10" data-track-index="6">
            <div class="emoji-main">⭐</div>
            <div class="subtitle">你们是安全小卫士！</div>
            <div class="content-small">
                记住这些安全知识，<br>
                就能<span class="highlight">保护自己和小伙伴</span>了。<br>
                看到别的小朋友做得不对，<br>
                我们可以<span class="highlight-green">友好地提醒</span>他们哦！
            </div>
        </div>

        <!-- 场景7：结束场景 -->
        <div id="scene7" class="scene scene-s7 clip" data-start="50" data-duration="2" data-track-index="7">
            <div class="emoji-main">👏</div>
            <div class="title">做安全小卫士！</div>
        </div>

        <!-- 音频轨道 -->
        <audio id="narration" data-start="0" data-duration="48" data-track-index="0" src="narration.wav" data-volume="1"></audio>
    </div>

    <script>
        // 初始化时间线
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines["main"] = tl;

        // 场景1：标题场景（0-6s）
        tl.from('#scene1 .emoji-main', { 
            opacity: 0, 
            scale: 0.5, 
            y: -60, 
            duration: 0.6, 
            ease: "back.out(1.7)" 
        }, 0.3);

        tl.from('#scene1 .title', { 
            opacity: 0, 
            y: 40, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 0.8);

        tl.from('#scene1 .subtitle', { 
            opacity: 0, 
            y: 30, 
            duration: 0.5, 
            ease: "power2.out" 
        }, 1.3);

        // 场景2：引入场景（6-13s）
        tl.from('#scene2 .emoji-main', { 
            opacity: 0, 
            scale: 0, 
            rotation: -20, 
            duration: 0.5, 
            ease: "back.out(1.7)" 
        }, 5.0);

        tl.from('#scene2 .content', { 
            opacity: 0, 
            x: -40, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 5.5);

        // 场景3：核心秘诀（13-22s）
        tl.from('#scene3 .emoji-main', { 
            opacity: 0, 
            scale: 0.3, 
            rotation: 45, 
            duration: 0.6, 
            ease: "back.out(1.7)" 
        }, 14.9);

        tl.from('#scene3 .subtitle', { 
            opacity: 0, 
            y: 40, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 15.5);

        tl.from('#scene3 .content-small', { 
            opacity: 0, 
            y: 30, 
            duration: 0.5, 
            ease: "power2.out" 
        }, 16.0);

        // 场景4：排队规则（22-30s）
        tl.from('#scene4 .emoji-main', { 
            opacity: 0, 
            scale: 0.4, 
            y: 60, 
            duration: 0.6, 
            ease: "back.out(1.7)" 
        }, 27.2);

        tl.from('#scene4 .subtitle', { 
            opacity: 0, 
            y: -30, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 27.8);

        tl.from('#scene4 .content-small', { 
            opacity: 0, 
            x: 40, 
            duration: 0.5, 
            ease: "power2.out" 
        }, 28.3);

        // 场景5：儿歌（30-40s）
        tl.from('#scene5 .emoji-main', { 
            opacity: 0, 
            scale: 0, 
            rotation: -30, 
            duration: 0.6, 
            ease: "back.out(1.7)" 
        }, 36.1);

        tl.from('#scene5 .subtitle', { 
            opacity: 0, 
            y: 40, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 36.7);

        tl.from('#scene5 .verse', { 
            opacity: 0, 
            y: 30, 
            duration: 0.5, 
            ease: "power2.out" 
        }, 37.2);

        // 场景6：强化鼓励（40-50s）
        tl.from('#scene6 .emoji-main', { 
            opacity: 0, 
            scale: 0.3, 
            rotation: 360, 
            duration: 0.6, 
            ease: "back.out(1.7)" 
        }, 40.3);

        tl.from('#scene6 .subtitle', { 
            opacity: 0, 
            y: 40, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 40.9);

        tl.from('#scene6 .content-small', { 
            opacity: 0, 
            y: 30, 
            duration: 0.5, 
            ease: "power2.out" 
        }, 41.4);

        // 场景7：结束场景（50-52s）
        tl.from('#scene7 .emoji-main', { 
            opacity: 0, 
            scale: 0.5, 
            y: -40, 
            duration: 0.5, 
            ease: "back.out(1.7)" 
        }, 50.3);

        tl.from('#scene7 .title', { 
            opacity: 0, 
            y: 30, 
            duration: 0.5, 
            ease: "power3.out" 
        }, 50.8);

        // 最后一个场景的淡出
        tl.to('#scene7', { 
            opacity: 0, 
            duration: 1.5, 
            ease: "power2.inOut" 
        }, 50.5);

        // 播放控制
        document.addEventListener('DOMContentLoaded', function() {
            tl.play();
        });
    </script>
</body>
</html>
